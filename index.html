var L='ru';try{L=localStorage.getItem('rd_lang')||((navigator.language||'').slice(0,2)==='ru'?'ru':'en')}catch(e){}
var $=function(i){return document.getElementById(i)},idx=0,run=true,timer=null,sel=null,c={s:0,m:0,h:0,d:0},nChats=16,items=[];
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function hl(text,keys){var t=esc(text);(keys||[]).forEach(function(k){var re=new RegExp('('+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','i');t=t.replace(re,'<mark>$1</mark>')});return t}
function apply(){var t=T[L];document.documentElement.lang=L;
  document.querySelectorAll('[data-i]').forEach(function(el){var v=t[el.dataset.i];if(v==null)return;el.hasAttribute('data-html')?el.innerHTML=v:el.textContent=v});
  document.querySelectorAll('.lang button').forEach(function(b){b.classList.toggle('on',b.dataset.set===L)});
  $('kw').innerHTML=t.kw.map(function(k){return'<span>'+esc(k)+'</span>'}).join('');
  $('chats').innerHTML=t.chats.map(function(n,i){return'<li data-c="'+i+'"><i></i>'+esc(n)+'</li>'}).join('');
  $('disc').innerHTML=t.disc.map(function(d,i){return'<div class="dg"><b>'+esc(d[0])+'</b><div><span>'+t.rel+' '+d[1]+'% · '+d[2]+'</span><button data-d="'+i+'">'+t.add+'</button></div></div>'}).join('');
  document.querySelectorAll('[data-d]').forEach(function(b){b.onclick=function(){var d=t.disc[+b.dataset.d];b.disabled=true;b.textContent=t.added;nChats++;$('nChats').textContent=nChats;
    var li=document.createElement('li');li.className='new';li.dataset.c=t.chats.length+(+b.dataset.d);li.innerHTML='<i></i>'+esc(d[0]);$('chats').appendChild(li)}});
  $('nChats').textContent=nChats;setPause();
}
function setPause(){var t=T[L];$('pause').textContent=run?'❚❚ '+t.pause:'▶ '+t.play;$('live').classList.toggle('off',!run);$('live').querySelector('span').textContent=run?t.live:t.paused}
function upC(){$('cS').textContent=c.s.toLocaleString(L==='ru'?'ru-RU':'en-US');$('cM').textContent=c.m;$('cH').textContent=c.h;$('cD').textContent=c.d}
function ping(ci){var li=document.querySelector('[data-c="'+ci+'"]');if(!li)return;li.classList.add('ping');setTimeout(function(){li.classList.remove('ping')},900)}
function step(){
  var t=T[L],f=t.F[idx%t.F.length],n=idx;idx++;
  c.s+=20+Math.floor(Math.random()*45);ping(f[0]);
  var el=document.createElement('button'),info=f[2];
  el.className='it '+(info?'match':'noise');
  el.innerHTML='<span class="ch"># '+esc(t.chats[f[0]])+' · '+t.ago+'</span>'+(info?'<span class="tg wait">'+t.wait+'</span>':'<span></span>')+'<span class="tx">'+hl(f[1],info&&info.k)+'</span>';
  $('feed').prepend(el);
  if(info){c.m++;var rec={f:f,el:el,n:n};items.push(rec);
    el.onclick=function(){select(rec)};
    setTimeout(function(){var tg=el.querySelector('.tg');tg.className='tg '+info.l;tg.textContent=t[info.l];
      if(info.l==='hot')c.h++;if(info.d)c.d++;upC();if(info.l==='hot'&&(!sel||sel.f[2].l!=='hot'))select(rec)},1100);}
  while($('feed').children.length>40)$('feed').lastChild.remove();
  upC();
}
function select(rec){var t=T[L],info=rec.f[2];sel=rec;
  document.querySelectorAll('.it.sel').forEach(function(e){e.classList.remove('sel')});rec.el.classList.add('sel');
  var draft=info.d?'<div class="box"><h5>'+t.hDraft+'</h5><div class="draft">'+esc(info.d)+'</div><div class="acts"><button class="p" id="cp">'+t.copy+'</button><button>'+t.open+' ↗</button></div></div>':'<div class="box"><div class="empty" style="padding:10px;text-align:left">'+t.noDraft+'</div></div>';
  $('det').innerHTML='<div class="box"><h5><span>'+t.hLead+'</span><span class="tg '+info.l+'">'+t[info.l]+'</span></h5><div class="quote">'+hl(rec.f[1],info.k)+'</div><div class="meta"># '+esc(t.chats[rec.f[0]])+' · '+t.ago+'</div></div>'+
   '<div class="box"><h5>'+t.hWhy+'</h5>'+(info.l!=='skip'?'<div class="score '+info.l+'"><i></i><i></i><i></i></div>':'')+'<ul class="why">'+info.w.map(function(w){return'<li>'+esc(w)+'</li>'}).join('')+'</ul></div>'+draft;
  var cp=$('cp');if(cp)cp.onclick=function(){try{navigator.clipboard.writeText(info.d)}catch(e){}cp.textContent=t.copied;cp.className='ok'};
}
function emptyDet(){$('det').innerHTML='<div class="box"><div class="empty"><span>( • )</span>'+T[L].empty+'</div></div>'}
function loop(){clearInterval(timer);if(run)timer=setInterval(step,1700)}
$('pause').onclick=function(){run=!run;setPause();loop()};
document.querySelectorAll('.lang button').forEach(function(b){b.onclick=function(){L=b.dataset.set;try{localStorage.setItem('rd_lang',L)}catch(e){}
  idx=0;sel=null;items=[];c={s:0,m:0,h:0,d:0};nChats=16;$('feed').innerHTML='';apply();upC();emptyDet();step();loop()}});
apply();upC();emptyDet();step();loop();
</script>
</body>
</html>
